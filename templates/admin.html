<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabu Portal Admin | カブ先生のお金の学校</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .outfit { font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-dark { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes slide-in-right { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .animate-slide-in-right { animation: slide-in-right 0.3s ease-out; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out; }
    </style>
</head>
<body class="text-slate-200 overflow-hidden">
    <div id="root">
        <div class="flex items-center justify-center h-screen bg-[#0f172a]">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500 mx-auto mb-4"></div>
                <p class="text-slate-400 outfit tracking-widest">KABU ADMIN INITIALIZING...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('column');
            const [content, setContent] = useState(null);
            const [selectedItem, setSelectedItem] = useState(null);
            const [loading, setLoading] = useState(true);
            const [deploying, setDeploying] = useState(false);
            const [deployLog, setDeployLog] = useState('');

            const tabs = [
                { id: 'column', label: '投資コラム', icon: '📝' },
                { id: 'manga', label: 'マンガで学ぶ', icon: '🎨' },
                { id: 'money_secret', label: 'お金のウラ事情', icon: '🕵️' },
                { id: 'diary', label: 'マネ太日記', icon: '📓' }
            ];

            useEffect(() => {
                fetchData();
                if (Notification.permission === 'default') {
                    Notification.requestPermission();
                }
            }, []);

            const playSuccessSound = () => {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); // C6
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            };

            const notifyUser = (title, body) => {
                if (Notification.permission === 'granted') {
                    new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/190/190411.png' });
                }
            };

            const fetchData = async () => {
                setLoading(true);
                try {
                    const res = await fetch('/api/content');
                    const data = await res.json();
                    setContent(data);
                } catch (err) {
                    console.error(err);
                    alert('データの読み込みに失敗しました');
                }
                setLoading(false);
            };

            const handleSave = async (updatedItem) => {
                const newData = content[activeTab].map(item => 
                    (item.id === updatedItem.id || (item.ep && item.ep === updatedItem.ep)) ? updatedItem : item
                );
                
                const isNew = !content[activeTab].find(i => (i.id === updatedItem.id || (i.ep && i.ep === updatedItem.ep)));
                if (isNew) {
                    newData.push(updatedItem);
                }

                try {
                    const res = await fetch(`/api/content/${activeTab}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newData)
                    });
                    const result = await res.json();
                    if (result.status === 'success') {
                        setContent({ ...content, [activeTab]: newData });
                        setSelectedItem(null);
                        showToast('保存しました！');
                    }
                } catch (err) {
                    alert('保存に失敗しました');
                }
            };

            const handleDeploy = async () => {
                if (!confirm('本番サイトへ反映しますか？')) return;
                setDeploying(true);
                setDeployLog('ビルド及びアップロードを開始します...\n');
                try {
                    const res = await fetch('/api/deploy', { method: 'POST' });
                    const result = await res.json();
                    setDeployLog(result.output || result.error || '完了しました');
                    if (result.status === 'success') {
                        playSuccessSound();
                        notifyUser('デプロイ完了', '本番サイトの更新が正常に終了しました！');
                        showToast('デプロイ完了！');
                    } else {
                        alert('デプロイに失敗しました');
                    }
                } catch (err) {
                    alert('通信エラーが発生しました');
                }
                setDeploying(false);
            };

            const showToast = (msg) => {
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-8 right-8 bg-emerald-500 text-white px-6 py-3 rounded-full shadow-lg z-50 animate-bounce';
                toast.innerText = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            };

            const getSummary = (item) => {
                const text = item.lead || item.summary || item.body || item.description_long || "";
                return text.length > 100 ? text.substring(0, 100) + "..." : text;
            };

            if (loading) return (
                <div className="flex items-center justify-center h-screen bg-[#0f172a]">
                    <div className="text-center">
                        <div className="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-indigo-500 mx-auto"></div>
                        <p className="mt-4 text-slate-400">Loading Data...</p>
                    </div>
                </div>
            );

            return (
                <div className="flex h-screen w-full bg-[#0b1120]">
                    {/* Sidebar */}
                    <div className="w-72 glass-dark flex flex-col p-6 z-20">
                        <div className="flex items-center gap-3 mb-10 px-2">
                            <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-indigo-500/20">🎓</div>
                            <h1 className="text-xl font-bold outfit tracking-tight text-white">Kabu Admin</h1>
                        </div>
                        
                        <nav className="space-y-2 flex-1">
                            {tabs.map(tab => (
                                <button 
                                    key={tab.id}
                                    onClick={() => { setActiveTab(tab.id); setSelectedItem(null); }}
                                    className={`w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all duration-300 ${activeTab === tab.id ? 'bg-indigo-600 shadow-lg shadow-indigo-500/20 text-white' : 'hover:bg-white/5 text-slate-400'}`}
                                >
                                    <span className="text-xl">{tab.icon}</span>
                                    <span className="font-medium">{tab.label}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="pt-6 border-t border-white/5 mt-6">
                            <button 
                                onClick={handleDeploy}
                                disabled={deploying}
                                className="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 disabled:opacity-50 text-white font-bold py-4 rounded-2xl shadow-xl transition-all flex items-center justify-center gap-2 group active:scale-95"
                            >
                                {deploying ? '🚀 デプロイ中...' : '🚀 本番へ反映'}
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 overflow-hidden flex flex-col">
                        <header className="h-20 flex items-center justify-between px-10 border-b border-white/5 bg-[#0f172a]/50 backdrop-blur-md">
                            <h2 className="text-2xl font-bold outfit text-white">{tabs.find(t => t.id === activeTab).label}</h2>
                            <button 
                                onClick={() => setSelectedItem({ id: `new_${Date.now()}`, title: '', body: '', date: new Date().toLocaleDateString().replace(/\//g, '.') })}
                                className="bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 px-6 py-2 rounded-full border border-indigo-500/30 font-semibold transition-all active:scale-95"
                            >
                                + 新規作成
                            </button>
                        </header>

                        <div className="flex-1 overflow-y-auto p-10 scrollbar-hide">
                            <div className="grid grid-cols-1 gap-4">
                                {content[activeTab]?.map((item, idx) => (
                                    <div 
                                        key={item.id || item.ep || idx} 
                                        onClick={() => setSelectedItem({ ...item })}
                                        className="glass p-6 rounded-2xl hover:border-indigo-500/50 cursor-pointer transition-all hover:translate-x-2 group flex items-center justify-between"
                                    >
                                        <div className="flex-1">
                                            <div className="flex items-center gap-3 mb-2">
                                                <span className="text-xs font-bold text-indigo-400 uppercase tracking-widest">{item.ep ? `EP.${item.ep}` : item.id}</span>
                                                <span className="text-xs text-slate-500">{item.date}</span>
                                            </div>
                                            <h3 className="text-lg font-bold group-hover:text-indigo-300 transition-colors text-slate-100">{item.title}</h3>
                                            <p className="text-slate-400 text-sm mt-1 line-clamp-1">{getSummary(item)}</p>
                                        </div>
                                        <div className="text-2xl text-slate-700 group-hover:text-indigo-500 transition-colors">→</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Editor Panel */}
                    {selectedItem && (
                        <div className="fixed inset-0 z-50 flex justify-end">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setSelectedItem(null)}></div>
                            <div className="w-[600px] h-full glass-dark shadow-2xl z-10 flex flex-col animate-slide-in-right">
                                <div className="p-8 border-b border-white/5 flex items-center justify-between">
                                    <h3 className="text-xl font-bold outfit text-white">編集: {selectedItem.id || `EP.${selectedItem.ep}`}</h3>
                                    <button onClick={() => setSelectedItem(null)} className="text-slate-500 hover:text-white transition-colors">✕ 閉じる</button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-8 space-y-6 scrollbar-hide">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-tighter">タイトル</label>
                                        <input 
                                            type="text" 
                                            value={selectedItem.title || ''} 
                                            onChange={(e) => setSelectedItem({...selectedItem, title: e.target.value})}
                                            className="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 transition-all text-white"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-tighter">日付</label>
                                            <input 
                                                type="text" 
                                                value={selectedItem.date || ''} 
                                                onChange={(e) => setSelectedItem({...selectedItem, date: e.target.value})}
                                                className="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500 text-white"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-tighter">ID / 話数</label>
                                            <input 
                                                type="text" 
                                                value={selectedItem.id || selectedItem.ep || ''} 
                                                onChange={(e) => {
                                                    if (selectedItem.ep) setSelectedItem({...selectedItem, ep: parseInt(e.target.value) || 0});
                                                    else setSelectedItem({...selectedItem, id: e.target.value});
                                                }}
                                                className="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500 text-white"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-tighter">概要 / リード文</label>
                                        <textarea 
                                            rows="3"
                                            value={selectedItem.lead || selectedItem.summary || ''} 
                                            onChange={(e) => {
                                                if (selectedItem.lead !== undefined) setSelectedItem({...selectedItem, lead: e.target.value});
                                                else setSelectedItem({...selectedItem, summary: e.target.value});
                                            }}
                                            className="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 text-white resize-none"
                                        ></textarea>
                                    </div>

                                    {selectedItem.body !== undefined && (
                                        <div>
                                            <label className="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-tighter">本文 (Markdown)</label>
                                            <textarea 
                                                rows="10"
                                                value={selectedItem.body || ''} 
                                                onChange={(e) => setSelectedItem({...selectedItem, body: e.target.value})}
                                                className="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 font-mono text-sm text-white resize-none"
                                            ></textarea>
                                        </div>
                                    )}

                                    {selectedItem.description_long !== undefined && (
                                        <div>
                                            <label className="block text-sm font-bold text-slate-400 mb-2 uppercase tracking-tighter">詳細解説 (Long)</label>
                                            <textarea 
                                                rows="6"
                                                value={selectedItem.description_long || ''} 
                                                onChange={(e) => setSelectedItem({...selectedItem, description_long: e.target.value})}
                                                className="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 text-white resize-none"
                                            ></textarea>
                                        </div>
                                    )}
                                </div>

                                <div className="p-8 border-t border-white/5 bg-slate-900/50">
                                    <button 
                                        onClick={() => handleSave(selectedItem)}
                                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/20 transition-all active:scale-[0.98]"
                                    >
                                        保存して閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Deploy Log Modal */}
                    {deployLog && !deploying && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-10">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setDeployLog('')}></div>
                            <div className="w-full max-w-4xl glass rounded-3xl overflow-hidden shadow-2xl animate-fade-in border border-white/10">
                                <div className="p-6 border-b border-white/10 flex justify-between items-center bg-indigo-600 text-white">
                                    <h3 className="font-bold text-xl outfit">🚀 デプロイ実行ログ</h3>
                                    <button onClick={() => setDeployLog('')} className="hover:opacity-70 text-2xl">✕</button>
                                </div>
                                <pre className="p-8 bg-[#0b1120] text-emerald-400 font-mono text-sm h-[500px] overflow-y-auto scrollbar-hide">
                                    {deployLog}
                                </pre>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
